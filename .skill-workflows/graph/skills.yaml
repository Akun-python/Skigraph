schema_version: 1

# Bundled workflow skills: skills/<id>/SKILL.md (see skills/README.md for licenses).
# Paths are project-relative; the loader appends /SKILL.md automatically.
skills:
  - id: algorithm-research-loop
    version: 1
    path: skills/algorithm-research-loop
    produces: [method-description, experiment-suite, experiment-state, experiment-decision, repair-plan, experiment-stop-report]

  # ---------- shared research core ----------
  - id: hypothesis-generation
    version: 1
    path: skills/hypothesis-generation
    produces: [research-plan]

  - id: scientific-brainstorming
    version: 1
    path: skills/scientific-brainstorming
    produces: [problem-statement]

  - id: scientific-critical-thinking
    version: 1
    path: skills/scientific-critical-thinking
    consumes: [evidence, results]
    produces: [critical-appraisal]

  - id: literature-review
    version: 1
    path: skills/literature-review
    consumes: [research-plan]
    produces: [literature-review]

  - id: paper-lookup
    version: 1
    path: skills/paper-lookup
    produces: [evidence-table]

  - id: experimental-design
    version: 1
    path: skills/experimental-design
    consumes: [research-plan, literature-review]
    produces: [methods]

  - id: statistical-power
    version: 1
    path: skills/statistical-power
    consumes: [methods]
    produces: [power-analysis]

  - id: exploratory-data-analysis
    version: 1
    path: skills/exploratory-data-analysis
    consumes: [methods]
    produces: [data-profile]

  - id: statistical-analysis
    version: 1
    path: skills/statistical-analysis
    consumes: [methods, data-profile]
    produces: [analysis-report]

  - id: statsmodels
    version: 1
    path: skills/statsmodels
    consumes: [data]
    produces: [statistical-model]

  - id: scientific-visualization
    version: 1
    path: skills/scientific-visualization
    consumes: [analysis-report]
    produces: [figures, figure-inventory, figure-provenance]

  - id: paper-figure-contract
    version: 1
    source: local
    path: skills/paper-figure-contract
    produces: [figure-inventory, figure-provenance, figure-audit, figure-gap-report]

  - id: stage-skill-memory
    version: 1
    path: skills/stage-skill-memory
    produces: [stage-skill-memory]

  - id: markdown-mermaid-writing
    version: 1
    path: skills/markdown-mermaid-writing
    produces: [method-description]

  - id: scientific-writing
    version: 1
    path: skills/scientific-writing
    consumes: [literature-review, methods]
    produces: [manuscript, evidence-bound-manuscript]

  - id: peer-review
    version: 1
    path: skills/peer-review
    consumes: [manuscript]
    produces: [review-report, manuscript-snapshot, review-memory]

  - id: citation-management
    version: 1
    path: skills/citation-management
    consumes: [manuscript]
    produces: [bibliography]

  - id: venue-templates
    version: 1
    path: skills/venue-templates
    consumes: [manuscript, bibliography]
    produces: [final-paper]

  # ---------- computer-science / algorithm papers ----------
  - id: scikit-learn
    version: 1
    path: skills/scikit-learn
    consumes: [methods]
    produces: [experiment-code, benchmark-results]

  # ---------- clinical / medical papers ----------
  - id: clinical-reports
    version: 1
    path: skills/clinical-reports
    consumes: [study-protocol]
    produces: [clinical-report]

  - id: clinical-decision-support
    version: 1
    path: skills/clinical-decision-support
    produces: [clinical-question]

  - id: pyhealth
    version: 1
    path: skills/pyhealth
    consumes: [study-protocol]
    produces: [cohort-dataset]

  - id: scikit-survival
    version: 1
    path: skills/scikit-survival
    consumes: [cohort-dataset]
    produces: [survival-analysis]

  # ---------- bioinformatics / omics papers ----------
  - id: bulk-rnaseq
    version: 1
    path: skills/bulk-rnaseq
    consumes: [analysis-plan]
    produces: [quantification]

  - id: pydeseq2
    version: 1
    path: skills/pydeseq2
    consumes: [quantification]
    produces: [differential-expression]

  - id: scanpy
    version: 1
    path: skills/scanpy
    consumes: [analysis-plan]
    produces: [cell-annotation]

  - id: scvi-tools
    version: 1
    path: skills/scvi-tools
    consumes: [cell-annotation]
    produces: [integrated-dataset]

  - id: qiime2-amplicon
    version: 1
    path: skills/qiime2-amplicon
    consumes: [analysis-plan]
    produces: [asv-table]

  - id: scikit-bio
    version: 1
    path: skills/scikit-bio
    consumes: [asv-table]
    produces: [diversity-stats]

  - id: pathway-enrichment
    version: 1
    path: skills/pathway-enrichment
    consumes: [differential-expression, cell-annotation, diversity-stats]
    produces: [enrichment-results]
