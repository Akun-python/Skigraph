schema_version: 1
id: paper-algo
version: 1
mode: agent

# 计算机 / 机器学习实证与算法论文流水线
# 提示词 -> 主张/证据账本 -> 方法与协议 -> 实验 -> 审计 -> 统计 -> 图 -> 论文 -> 评审循环 -> 引用 -> LaTeX/PDF -> 发布门
required_inputs: [prompt]
entry: idea

nodes:
  - id: idea
    type: agent
    skill: scientific-brainstorming
    task: |
      Turn the prompt into a research thesis appropriate to the evidence. If the
      prompt describes a baseline or pipeline comparison, do not force an
      algorithmic-novelty claim: state the narrower empirical question and the
      claims the available design can actually test. Otherwise state the
      computational problem formally (input/output/objective), limitations of
      current methods, and 2-3 mechanism-level candidate contributions. For each
      claim, write the cheapest experiment that would refute it. Emit
      `problem_statement.md` and `novelty_hypotheses.json`
      (id, claim, mechanism, refuting experiment, closest prior work).
    inputs:
      prompt: "{{input:prompt}}"
    outputs:
      - name: problem_statement
        required: true
      - name: novelty_hypotheses.json
        required: true

  - id: related
    type: agent
    skill: literature-review
    task: |
      Review the algorithmic literature relevant to the problem statement:
      problem formulations, competing method families, standard benchmarks and
      metrics, known lower bounds or impossibility results. Emit
      `literature_review.md` with a related-work section ready for the paper and
      an explicit statement of what is genuinely new in this work (and what is
      only an engineering combination).
    inputs:
      problem_statement: "{{artifact:idea:problem_statement}}"
      novelty_hypotheses: "{{artifact:idea:novelty_hypotheses.json}}"
    outputs:
      - name: literature_review
        required: true

  - id: approach
    type: agent
    skill: markdown-mermaid-writing
    task: |
      Specify the method precisely enough to implement twice: formal definitions,
      algorithm block (pseudocode), a mermaid architecture/flow diagram, data
      structures, hyperparameters with ranges, and complexity analysis
      (time/space, per-epoch and per-inference). State every assumption and the
      failure mode it implies. Emit `method_description.md`.
    inputs:
      problem_statement: "{{artifact:idea:problem_statement}}"
      literature_review: "{{artifact:related:literature_review}}"
    outputs:
      - name: method_description
        required: true

  - id: protocol
    type: agent
    skills: [experimental-design, algorithm-research-loop]
    task: |
      Follow algorithm-research-loop: freeze development-only selection and budgets,
      and specify comparison, ablation, sensitivity, efficiency and applicable
      robustness rows. On revisit consume repair_feedback and prior_state;
      record amendments and never recycle observed tests as untouched data.
      Design the experimental protocol that would convince a hostile reviewer:
      datasets (with sizes/splits/licences), baselines (strongest published, plus
      naive), metrics with definitions and aggregation, seeds and number of runs,
      compute budget, statistical tests, and an ablation matrix that isolates each
      claim. Label the protocol as preregistered only when it was actually
      registered before outcomes were observed; otherwise mark it exploratory or
      post-hoc. Emit `experiment_protocol.md` and a machine readable
      `experiment_protocol.json`. Also emit method_description.md containing the
      exact current method (including bound method improvements).
    inputs:
      method_description: "{{artifact:approach:method_description}}"
      repair_feedback:
        value: "{{artifact:experiment_diagnosis:repair_plan}}"
        required: false
      prior_state:
        value: "{{artifact:experiment_diagnosis:experiment_state.json}}"
        required: false
      literature_review: "{{artifact:related:literature_review}}"
    outputs:
      - name: experiment_protocol
        required: true
      - name: experiment_protocol.json
        required: true
      - name: method_description
        required: true

  - id: implement
    type: agent
    skills: [scikit-learn, algorithm-research-loop]
    task: |
      Execute every applicable experiment family, retaining runnable source,
      raw logs and failed configurations. Emit experiment_suite.json with row
      IDs, family, measured/not_run/not_applicable status and provenance.
      On revisit consume repair_feedback and prior_state; tune only on inner
      training/validation, with matched baseline search budgets. Do not use
      evaluation performance to pick a candidate.
      Implement the method and the full comparison matrix from the protocol.
      Write runnable code plus a reproduction script; record every run's config,
      seed and environment. Emit `experiment_code.md` (module layout + entry
      point + how to reproduce) and `benchmark_results.json` with one record per
      (method, dataset, metric, seed) and exact scores as measured. Do not
      fabricate numbers: if a configuration could not be run, record it as
      `not_run` with the reason. Record the dataset's official source URL,
      license or access terms, download date, SHA-256 checksum, target and
      features, preprocessing, splits and seeds. Fit preprocessing only on
      training data; retain executable code and per-fold raw results.
    inputs:
      repair_feedback:
        value: "{{artifact:experiment_diagnosis:repair_plan}}"
        required: false
      prior_state:
        value: "{{artifact:experiment_diagnosis:experiment_state.json}}"
        required: false
      method_description: "{{artifact:protocol:method_description}}"
      experiment_protocol: "{{artifact:protocol:experiment_protocol}}"
    outputs:
      - name: experiment_code
        required: true
      - name: benchmark_results.json
        required: true
      - name: experiment_suite.json
        required: true

  - id: experiment_diagnosis
    type: agent
    skills: [algorithm-research-loop, scientific-critical-thinking]
    task: |
      Diagnose method, tuning or execution defects from measured validation
      evidence and the issue ledger. Follow the controller contract exactly.
      Emit experiment_state.json, experiment_decision.json and repair_plan.md.
      Run scripts/experiment-controller.mjs and copy its decision to node_result.
      Initialize round=0, max_rounds=3, patience=2; on revisits consume prior_state,
      increment round and preserve cumulative history. Never invent progress.
      ready requires hard gates, complete claim-linked evidence and no unresolved
      major issue; negative results qualify. All other stop decisions retain
      draft status. Do not claim global optimality or publication readiness.
    inputs:
      suite: "{{artifact:implement:experiment_suite.json}}"
      protocol: "{{artifact:protocol:experiment_protocol.json}}"
      method: "{{artifact:protocol:method_description}}"
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      evidence_audit: "{{artifact:evidence_audit:evidence_audit}}"
      analysis: "{{artifact:stats:analysis_report.json}}"
      ablation: "{{artifact:ablation:ablation_report}}"
      prior_state:
        value: "{{artifact:experiment_diagnosis:experiment_state.json}}"
        required: false
    outputs:
      - name: experiment_state.json
        required: true
      - name: experiment_decision.json
        required: true
      - name: repair_plan
        required: true

  - id: method_improvement
    type: agent
    skills: [algorithm-research-loop, experimental-design]
    task: |
      Consume the diagnosed mechanism failure and propose an implementable,
      falsifiable change. Emit method_description.md with pseudocode, complexity,
      parameter ranges and a validation acceptance rule. Preserve previous valid
      candidate and justify rollback on regression. No test-guided redesign.
    inputs:
      method: "{{artifact:protocol:method_description}}"
      repair_feedback: "{{artifact:experiment_diagnosis:repair_plan}}"
      prior_state: "{{artifact:experiment_diagnosis:experiment_state.json}}"
    outputs:
      - name: method_description
        required: true

  - id: experiment_stop
    type: agent
    skill: algorithm-research-loop
    task: |
      Emit experiment_stop_report.md documenting the exact stop decision,
      unresolved issues, best valid candidate, retained artifacts and required
      human action. This is an incomplete research exit, not release success.
    inputs:
      decision: "{{artifact:experiment_diagnosis:experiment_decision.json}}"
      state: "{{artifact:experiment_diagnosis:experiment_state.json}}"
    outputs:
      - name: experiment_stop_report
        required: true
    terminal: true

  - id: evidence_audit
    type: agent
    skills:
      - scientific-critical-thinking
      - scientific-writing
    task: |
      Build a machine-readable evidence and provenance ledger before interpretation.
      Reconcile the protocol, implementation manifest, raw fold records and
      benchmark summary. Emit `evidence_manifest.json` with stable IDs for every
      dataset, method, run, metric, numeric result, figure source and citation
      candidate, plus `evidence_audit.md` listing missing, unverified or
      inconsistent items. Fail closed: never invent a value, source, license,
      version, confidence interval or claim. Mark post-hoc analyses and dependent
      resamples explicitly. This ledger is mandatory input to statistics, figures,
      drafting, review, citation verification and formatting.
    inputs:
      experiment_protocol: "{{artifact:protocol:experiment_protocol.json}}"
      experiment_code: "{{artifact:implement:experiment_code}}"
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
    outputs:
      - name: evidence_manifest.json
        required: true
      - name: evidence_audit
        required: true

  - id: eda
    type: agent
    skill: exploratory-data-analysis
    task: |
      Audit the benchmark results before interpreting them: distribution of
      scores per dataset, variance across seeds, outliers, suspiciously small
      gaps, leakage risks, and whether any baseline is under-tuned. Emit
      `data_profile.md` with the checks you ran and a verdict on which
      comparisons are statistically meaningful.
    inputs:
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      evidence_audit: "{{artifact:evidence_audit:evidence_audit}}"
    outputs:
      - name: data_profile
        required: true

  - id: ablation
    type: agent
    skill: scientific-critical-thinking
    task: |
      Analyse the already executed ablation matrix (do not run new unaudited
      experiments here; request execution repair through diagnosis): for each claimed novelty, the run
      with that component removed. Report efficiency (parameters, FLOPs,
      latency, memory), failure cases, and whether the gain survives removal of
      each component. Flag any claim the ablations do NOT support. Emit
      `ablation_report.md`.
    inputs:
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      experiment_code: "{{artifact:implement:experiment_code}}"
      method_description: "{{artifact:protocol:method_description}}"
      data_profile: "{{artifact:eda:data_profile}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
    outputs:
      - name: ablation_report
        required: true

  - id: stats
    type: agent
    skill: statistical-analysis
    task: |
      Run the statistical tests chosen in the protocol (paired tests across
      seeds, bootstrap CIs, effect sizes, multiple-comparison correction) and
      report them with uncertainty. Separate exploratory from confirmatory
      findings. Check the unit of analysis and assumptions before choosing a
      test: overlapping CV folds are not independent patients or independent
      replications. When inference is not supported, report descriptive paired
      differences and clearly labelled fold SDs/ranges, not p-values or CIs.
      Emit `analysis_report.md` and `analysis_report.json`.
    inputs:
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      ablation_report: "{{artifact:ablation:ablation_report}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
    outputs:
      - name: analysis_report
        required: true
      - name: analysis_report.json
        required: true

  - id: figures
    type: agent
    skills: [scientific-visualization, stage-skill-memory, paper-figure-contract]
    task: |
      On revisit consume release_gate_report and repair its numbered failures.
      Missing raw evidence requires needs_input, not invented replacement figures.
      Persist `stage_skill_memory.json` with complete-read status and open gates.
      Emit `figure_inventory.json` and `figure_provenance.json` mapping claim IDs
      to source artifacts/rows, transformations, statistical meaning, limitations,
      generator commands, static fallback and downstream consumers.
      Produce figures only for measured evidence; never invent efficiency,
      scaling or confidence intervals to fill a template. Emit `figures.md`,
      `figure_generation.py` and 6-10 distinct main-text figures. Preserve
      these three legacy output filenames as part of the set, not a ceiling: `figure1_main.pdf`
      (main results), `figure2_fold_differences.pdf` (paired contrasts, or another
      justified observed comparison), `figure3_difference_ranges.pdf` (explicitly
      descriptive variation, or valid uncertainty if justified). Explain any
      alternative panel design in figures.md. Use colourblind-conscious styling,
      readable fonts and zero-based bar axes; disclose zoomed axes. Record the
      source JSON pointers, units, captions and regeneration command. Every PDF
      and the script must be declared as an artifact, not only mentioned in prose.
    inputs:
      analysis_report: "{{artifact:stats:analysis_report}}"
      ablation_report: "{{artifact:ablation:ablation_report}}"
      analysis_report_json: "{{artifact:stats:analysis_report.json}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
    outputs:
      - name: figures
        required: true
      - name: figure_generation.py
        required: true
      - name: figure1_main.pdf
        required: true
      - name: figure2_fold_differences.pdf
        required: true
      - name: figure3_difference_ranges.pdf
        required: true
      - name: figure_inventory.json
        required: true
      - name: figure_provenance.json
        required: true
      - name: stage_skill_memory.json
        required: true
      - name: figure_gap_report.md
        required: true

  - id: draft
    type: agent
    skills: [scientific-writing, paper-figure-contract]
    task: |
      On revisit consume gate_report; preserve the last reviewed manuscript and
      evidence IDs, recording changes rather than restarting without context.
      Write the algorithm paper: abstract, introduction (problem + gap +
      contributions), related work, method (with the pseudocode and diagram),
      experimental setup, results (only claims the statistics support), ablation
      study, limitations, threats to validity, and conclusion. Emit
      `manuscript.md` with every number traceable to `benchmark_results.json` /
      `analysis_report.json`. State the unit of analysis, uncertainty method,
      data leakage checks and limitations; never treat correlated cross-validation
      folds as independent patient observations.
    inputs:
      literature_review: "{{artifact:related:literature_review}}"
      method_description: "{{artifact:protocol:method_description}}"
      experiment_protocol: "{{artifact:protocol:experiment_protocol}}"
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      analysis_report: "{{artifact:stats:analysis_report}}"
      analysis_report_json: "{{artifact:stats:analysis_report.json}}"
      figure_inventory: "{{artifact:figures:figure_inventory.json}}"
      figure_provenance: "{{artifact:figures:figure_provenance.json}}"
      figure_skill_memory: "{{artifact:figures:stage_skill_memory.json}}"
      figure_gap_report: "{{artifact:figures:figure_gap_report.md}}"
      figures: "{{artifact:figures:figures}}"
      figure1_main: "{{artifact:figures:figure1_main.pdf}}"
      figure2_fold_differences: "{{artifact:figures:figure2_fold_differences.pdf}}"
      figure3_difference_ranges: "{{artifact:figures:figure3_difference_ranges.pdf}}"
    outputs:
      - name: manuscript
        required: true

  - id: review
    type: agent
    skills: [peer-review, paper-figure-contract]
    task: |
      Review the manuscript as a top-venue reviewer would: novelty vs the
      literature, correctness of the complexity and statistical claims,
      fairness of baselines, reproducibility, and clarity. Emit
      `review_report.md` with severity-tagged items and
      `manuscript_under_review.md` (the snapshot you reviewed). In
      `node_result.json` set `decision` to "accept" if the paper is
      publication-ready, otherwise "revise".
    inputs:
      manuscript: "{{artifact:draft:manuscript}}"
      figure_inventory: "{{artifact:figures:figure_inventory.json}}"
      figure_provenance: "{{artifact:figures:figure_provenance.json}}"
      figure_gap_report: "{{artifact:figures:figure_gap_report.md}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      evidence_audit: "{{artifact:evidence_audit:evidence_audit}}"
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      analysis_report: "{{artifact:stats:analysis_report.json}}"
      figures: "{{artifact:figures:figures}}"
      figure1_main: "{{artifact:figures:figure1_main.pdf}}"
      figure2_fold_differences: "{{artifact:figures:figure2_fold_differences.pdf}}"
      figure3_difference_ranges: "{{artifact:figures:figure3_difference_ranges.pdf}}"
    outputs:
      - name: review_report
        required: true
      - name: manuscript_under_review
        required: true

  - id: revise
    type: agent
    skills: [scientific-writing, paper-figure-contract]
    task: |
      Revise to resolve every review item, adding experiments or analyses where
      the reviewer demands evidence rather than only rewriting prose. Emit
      `revised_manuscript.md` (full manuscript) and `revision_notes.md` mapping
      each review item to the concrete change, evidence IDs, and status (resolved,
      unresolved, or scope-reduced). Never close a missing experiment by prose
      alone. Keep unresolved major issues and draft status visible.
    inputs:
      prompt: "{{input:prompt}}"
      manuscript: "{{artifact:review:manuscript_under_review}}"
      review_report: "{{artifact:review:review_report}}"
      figure_inventory: "{{artifact:figures:figure_inventory.json}}"
      figure_provenance: "{{artifact:figures:figure_provenance.json}}"
      figure_gap_report: "{{artifact:figures:figure_gap_report.md}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      experiment_code: "{{artifact:implement:experiment_code}}"
      experiment_protocol: "{{artifact:protocol:experiment_protocol}}"
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      analysis_report: "{{artifact:stats:analysis_report.json}}"
      figures: "{{artifact:figures:figures}}"
      figure1_main: "{{artifact:figures:figure1_main.pdf}}"
      figure2_fold_differences: "{{artifact:figures:figure2_fold_differences.pdf}}"
      figure3_difference_ranges: "{{artifact:figures:figure3_difference_ranges.pdf}}"
    outputs:
      - name: revised_manuscript
        required: true
      - name: revision_notes
        required: true

  - id: citations
    type: agent
    skill: citation-management
    task: |
      On revisit consume release_gate_report; reverify each failed citation
      against its actual source. Do not invent a DOI or close a source mismatch.
      Verify the bibliography of the accepted manuscript: resolve in-text
      citations to DOI/arXiv IDs, emit `references.bib`, and write
      `citation_audit.md` listing unverifiable or duplicate entries. Ensure
      every baseline and claimed prior result is cited to a real paper.
    inputs:
      manuscript: "{{artifact:review:manuscript_under_review}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      evidence_audit: "{{artifact:evidence_audit:evidence_audit}}"
    outputs:
      - name: bibliography
        required: true
      - name: citation_audit
        required: true

  - id: format
    type: agent
    skills: [venue-templates, paper-figure-contract]
    task: |
      On revisit consume release_gate_report and repair its exact package faults.
      Preserve reviewed claims; scientific edits require renewed peer review.
      Assemble the submission-ready paper using a venue template matching the
      field (NeurIPS/ICML/ICLR or ACM/IEEE fallback): camera-ready layout,
      figures placed, bibliography resolved, appendix for the full experiment
      protocol, and an anonymity check. Emit `final_paper.tex` plus
      `submission_checklist.md` (page limit, supplementary material, code/data
      availability, ethics statement). Copy declared figure assets and bibliography
      into this visit output directory, embed real figures, compile native LaTeX
      using scripts/compile-paper.mjs, and emit final_paper.pdf and
      paper_page_count.json with measured counts. Do not pad page counts; retain
      draft labelling unless scientific and provenance issues are resolved.
    inputs:
      manuscript: "{{artifact:review:manuscript_under_review}}"
      bibliography: "{{artifact:citations:bibliography}}"
      citation_audit: "{{artifact:citations:citation_audit}}"
      figures: "{{artifact:figures:figures}}"
      figure1_main: "{{artifact:figures:figure1_main.pdf}}"
      figure2_fold_differences: "{{artifact:figures:figure2_fold_differences.pdf}}"
      figure3_difference_ranges: "{{artifact:figures:figure3_difference_ranges.pdf}}"
      figure_generation: "{{artifact:figures:figure_generation.py}}"
      figure_inventory: "{{artifact:figures:figure_inventory.json}}"
      figure_provenance: "{{artifact:figures:figure_provenance.json}}"
      figure_gap_report: "{{artifact:figures:figure_gap_report.md}}"
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      review_report: "{{artifact:review:review_report}}"
      revision_notes:
        value: "{{artifact:revise:revision_notes}}"
        required: false
    outputs:
      - name: final_paper.tex
        required: true
      - name: final_paper.pdf
        required: true
      - name: paper_page_count.json
        required: true
      - name: submission_checklist
        required: true
      - name: figure_audit.json
        required: true



  - id: release_gate
    type: agent
    skills: [scientific-critical-thinking, paper-figure-contract]
    task: |
      Inspect the actual final_paper.pdf, final_paper.tex, page-count JSON,
      figures, bibliography, evidence manifest, citation audit, review report and
      manuscript. Run pdfinfo, pdftotext and a fresh native compile when possible.
      Verify that every numeric result and displayed figure has a provenance ID,
      every reference is verified or explicitly unresolved, no unresolved major
      review item is silently closed, and no missing experiment is described as
      completed. Check layout, figure readability, captions, page count and
      substantive content against the declared venue—not a universal 15-25 page
      target. Write release_gate_report.md with measured counts and exact
      remediation. Set decision to pass only when every applicable hard check
      passes. If the failure is specifically figure evidence or provenance, set
      decision to revise_figures; if citations or attribution fail, set
      revise_citations; if the TeX/PDF package or venue formatting fails, set
      revise_format; otherwise set revise for substantive manuscript repair.
      Never report pass while any hard check is unresolved.
    inputs:
      evidence_manifest: "{{artifact:evidence_audit:evidence_manifest.json}}"
      evidence_audit: "{{artifact:evidence_audit:evidence_audit}}"
      citation_audit: "{{artifact:citations:citation_audit}}"
      review_report: "{{artifact:review:review_report}}"
      benchmark_results: "{{artifact:implement:benchmark_results.json}}"
      analysis_report: "{{artifact:stats:analysis_report.json}}"
      figure_audit: "{{artifact:format:figure_audit.json}}"
      figure_inventory: "{{artifact:figures:figure_inventory.json}}"
      figure_provenance: "{{artifact:figures:figure_provenance.json}}"
      figure_gap_report: "{{artifact:figures:figure_gap_report.md}}"
      final_paper_tex: "{{artifact:format:final_paper.tex}}"
      final_paper_pdf: "{{artifact:format:final_paper.pdf}}"
      page_count: "{{artifact:format:paper_page_count.json}}"
      submission_checklist:
        value: "{{artifact:format:submission_checklist}}"
        required: false
      reporting_checklist:
        value: "{{artifact:format:reporting_checklist}}"
        required: false
      coverage_appendix:
        value: "{{artifact:format:coverage_appendix}}"
        required: false
      manuscript:
        value: "{{artifact:review:manuscript_under_review}}"
        required: false
    outputs:
      - name: release_gate_report
        required: true

  - id: release_pass
    type: agent
    skill: scientific-writing
    task: |
      Confirm the release gate passed. Write release_manifest.md with the
      final PDF, LaTeX source, page count, figures and gate report paths.
    inputs:
      gate_report: "{{artifact:release_gate:release_gate_report}}"
      final_paper_pdf: "{{artifact:format:final_paper.pdf}}"
      final_paper_tex: "{{artifact:format:final_paper.tex}}"
      page_count: "{{artifact:format:paper_page_count.json}}"
      submission_checklist:
        value: "{{artifact:format:submission_checklist}}"
        required: false
      reporting_checklist:
        value: "{{artifact:format:reporting_checklist}}"
        required: false
      coverage_appendix:
        value: "{{artifact:format:coverage_appendix}}"
        required: false
    outputs:
      - name: release_manifest
        required: true
    terminal: true

edges:
  - from: idea
    to: related
    priority: 10
  - from: related
    to: approach
    priority: 10
  - from: approach
    to: protocol
    priority: 10
  - from: protocol
    to: implement
    priority: 10
  - from: implement
    to: evidence_audit
    priority: 10
  - from: evidence_audit
    to: eda
    priority: 10
  - from: eda
    to: ablation
    priority: 10
  - from: ablation
    to: stats
    priority: 10
  - from: stats
    to: experiment_diagnosis
    priority: 10
  - from: experiment_diagnosis
    to: figures
    when: 'result.decision == "ready"'
    priority: 30
  - from: experiment_diagnosis
    to: method_improvement
    when: 'result.decision == "repair_method"'
    priority: 20
  - from: method_improvement
    to: protocol
    bind:
      method_description: "{{artifact:method_improvement:method_description}}"
      repair_feedback: "{{artifact:experiment_diagnosis:repair_plan}}"
      prior_state: "{{artifact:experiment_diagnosis:experiment_state.json}}"
    loop:
      id: method-cycle
      max_iterations: 3
  - from: experiment_diagnosis
    to: implement
    when: 'result.decision == "repair_tuning" || result.decision == "repair_execution"'
    bind:
      repair_feedback: "{{artifact:experiment_diagnosis:repair_plan}}"
      prior_state: "{{artifact:experiment_diagnosis:experiment_state.json}}"
    loop:
      id: execution-cycle
      max_iterations: 3
  - from: experiment_diagnosis
    to: experiment_stop
    when: 'result.decision == "stalled" || result.decision == "needs_input" || result.decision == "budget_exhausted"'
    priority: 10
  - from: figures
    to: draft
    priority: 10
  - from: draft
    to: review
    priority: 10

  - from: review
    to: citations
    when: 'result.decision == "accept"'
    priority: 30
  - from: review
    to: revise
    when: 'result.decision == "revise"'
    priority: 20

  - from: revise
    to: review
    priority: 10
    bind:
      manuscript: "{{artifact:revise:revised_manuscript}}"
    loop:
      id: revision-cycle
      max_iterations: 3

  - from: citations
    to: format
    priority: 10
  - from: format
    to: release_gate
    priority: 10
  - from: release_gate
    to: release_pass
    when: 'result.decision == "pass"'
    priority: 30
  - from: release_gate
    to: draft
    when: 'result.decision == "revise"'
    priority: 20
    bind:
      gate_report: "{{artifact:release_gate:release_gate_report}}"
    loop:
      id: release-cycle
      max_iterations: 2
  - from: release_gate
    to: figures
    when: 'result.decision == "revise_figures"'
    priority: 25
    bind:
      release_gate_report: "{{artifact:release_gate:release_gate_report}}"
    loop:
      id: release-figures-cycle
      max_iterations: 2
  - from: release_gate
    to: citations
    when: 'result.decision == "revise_citations"'
    priority: 24
    bind:
      release_gate_report: "{{artifact:release_gate:release_gate_report}}"
    loop:
      id: release-citations-cycle
      max_iterations: 2
  - from: release_gate
    to: format
    when: 'result.decision == "revise_format"'
    priority: 23
    bind:
      release_gate_report: "{{artifact:release_gate:release_gate_report}}"
    loop:
      id: release-format-cycle
      max_iterations: 2

budgets:
  max_visits: 80
  max_agent_turns: 80
  max_duration_ms: 28800000
